<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Crow's Nest (cookieless, cn.dested.com): exactly this tag, always defer.
         Silent on localhost; the deployed host shows up as a pending site. -->
    <script defer src="https://cn.dested.com/cn.js"></script>
    <!-- color-scheme + theme-color are injected from the look (vite.config.ts). -->
    <!-- Generated from packages/brand/mark.svg by `bun run brand`. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Stylesheet is linked here (not imported from JS) so it is render-blocking
         in dev too — importing it from App.tsx made Vite inject it after the
         module graph loaded, painting unstyled SSR HTML first. -->
    <link rel="stylesheet" href="/src/styles/app.css" />
    <title>Sal Starter</title>
    <!-- The kickoff writes the real description (what the product is, one line). -->
    <meta name="description" content="Sal Starter" />
    <meta property="og:title" content="Sal Starter" />
    <meta property="og:description" content="Sal Starter" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <!--app-state-->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
