[install]
# Bun >=1.3.2 defaults new workspaces to isolated installs. Expo's podspecs,
# native modules and the Prisma CLI shim are happiest with one flat
# node_modules, so this stays hoisted (decisions.md).
linker = "hoisted"
# Only install versions published at least 3 days ago (supply-chain gate). It
# lives here, not only in a per-user bunfig, so every machine and every fork
# (WSL, Windows, EAS, Drydock) gets the same resolution.
minimumReleaseAge = 259200
